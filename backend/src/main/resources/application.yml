spring:
  application:
    name: parking

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    time-zone: Asia/Seoul

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true