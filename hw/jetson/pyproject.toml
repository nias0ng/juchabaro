[tool.pytest.ini_options]
# hw/jetson을 sys.path에 넣어 `from src.parking...` 임포트가 실행 위치와 무관하게
# 해석되게 한다. 이 줄이 없으면 hw/jetson 밖에서 pytest를 부를 때 임포트가 깨진다.
pythonpath = ["."]
testpaths = ["tests"]
# rootdir은 이 파일에 [tool.pytest.ini_options] 절이 있다는 사실만으로 hw/jetson에
# 고정된다 — 상위 디렉터리에 다른 설정 파일이 생겨도 흔들리지 않는다. 아래 addopts는
# rootdir과 무관하며, 건너뛴 테스트와 실패 사유를 실행 요약에 항상 찍는 옵션이다.
addopts = "-ra"
